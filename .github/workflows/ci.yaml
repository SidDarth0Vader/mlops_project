name: Deploy Images to GHCR

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  push-store-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: '.'
    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@main

      - name: 'Login to GitHub Container Registry'
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}

      - name: 'Build Image'
        run: |
          docker build . --tag ghcr.io/${{ github.actor }}/mlops_project:${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}

      - name: 'Push image'
        run: |
          docker push ghcr.io/${{ github.actor }}/mlops_project:${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
